services:
  weather-api:
    build:
      context: ./wather-api
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: "3000"
      MONGO_URI_DEV: mongodb://mongo:27017/gdash
    ports:
      - "3000:3000"
    volumes:
      - ./wather-api:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
    command: npm run start:dev

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # broker
      - "15672:15672" # painel web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  data-collector:
    build:
      context: ./data-colector
      dockerfile: Dockerfile.dev
    container_name: data-collector
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      INPUT_QUEUE: weather.locations
      OUTPUT_QUEUE: weather.jobs
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data-colector:/app
    command: >
      watchmedo auto-restart
      --debug-force-polling
      --directory=/app
      --patterns="*.py"
      --recursive
      --
      python app.py
  go-worker:
    build:
      context: ./go-worker
      dockerfile: Dockerfile.dev
    container_name: go-worker
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      NEST_API_URL: http://weather-api:3000/weather/intake
    depends_on:
      - rabbitmq
      - weather-api
    volumes:
      - ./go-worker:/app
