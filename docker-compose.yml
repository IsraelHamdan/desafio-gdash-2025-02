services: 
  mongo: 
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports: 
      - "27017:27017"
    volumes: 
      - mongo_data:/data/db 

  weather-api: 
    build:
      context: ./wather-api
      dockerfile: Dockerfile
    container_name: weather-api
    restart: unless-stopped
    env_file:
      - ./wather-api/.env
    ports: 
      - "3000:3000"
    depends_on:
      - mongo
    volumes: 
      - ./wather-api:/app


volumes:
  mongo_data:
